<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Something for You, Baby ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>I made something for you, baby. ❤️</h1>
            <p>Click each flower to see what I wanted to tell you</p>
        </div>

        <div class="scene">
            <div class="bouquet-container">
            <svg class="bouquet-svg" viewBox="0 0 350 550" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="roseGrad" cx="35%" cy="30%" r="75%">
                        <stop offset="0%" style="stop-color:#ffe1ea;stop-opacity:1" />
                        <stop offset="55%" style="stop-color:#ff8fab;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#df5384;stop-opacity:1" />
                    </radialGradient>
                    <radialGradient id="roseGrad2" cx="40%" cy="35%" r="75%">
                        <stop offset="0%" style="stop-color:#ffc3d6;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#e8618e;stop-opacity:1" />
                    </radialGradient>
                    <radialGradient id="carnationGrad" cx="42%" cy="35%" r="65%">
                        <stop offset="0%" style="stop-color:#fff2f6;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#ffaecb;stop-opacity:1" />
                    </radialGradient>
                    <radialGradient id="carnationGrad2" cx="42%" cy="35%" r="65%">
                        <stop offset="0%" style="stop-color:#ffd8e5;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#f17ba0;stop-opacity:1" />
                    </radialGradient>
                    <radialGradient id="lilyGrad" cx="50%" cy="85%" r="95%">
                        <stop offset="0%" style="stop-color:#fff6f9;stop-opacity:1" />
                        <stop offset="55%" style="stop-color:#ffb8d2;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#e7588f;stop-opacity:1" />
                    </radialGradient>
                    <linearGradient id="stem" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#8ba876;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#5b7350;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="wrapper" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#fbe0e6;stop-opacity:0.95" />
                        <stop offset="100%" style="stop-color:#fdf6f3;stop-opacity:0.95" />
                    </linearGradient>
                    <linearGradient id="sagewrap" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#8a9a6e;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#5f6e46;stop-opacity:1" />
                    </linearGradient>

                    <!-- Reusable flower symbols -->
                    <g id="pinkrose">
                        <circle cx="0" cy="5" r="18" fill="url(#roseGrad)" opacity="0.9"/>
                        <circle cx="-5" cy="0" r="15" fill="url(#roseGrad2)" opacity="0.85"/>
                        <circle cx="5" cy="0" r="15" fill="url(#roseGrad2)" opacity="0.85"/>
                        <circle cx="0" cy="-10" r="12" fill="#ff9ebb" opacity="0.9"/>
                        <circle cx="0" cy="10" r="12" fill="#df5384" opacity="0.85"/>
                        <circle cx="0" cy="0" r="8" fill="#ffb3c9" opacity="0.95"/>
                    </g>

                    <g id="carnation">
                        <g fill="url(#carnationGrad)" opacity="0.95">
                            <ellipse cx="0" cy="-11" rx="3" ry="8" transform="rotate(0)"/>
                            <ellipse cx="0" cy="-11" rx="3" ry="8" transform="rotate(36)"/>
                            <ellipse cx="0" cy="-11" rx="3" ry="8" transform="rotate(72)"/>
                            <ellipse cx="0" cy="-11" rx="3" ry="8" transform="rotate(108)"/>
                            <ellipse cx="0" cy="-11" rx="3" ry="8" transform="rotate(144)"/>
                            <ellipse cx="0" cy="-11" rx="3" ry="8" transform="rotate(180)"/>
                            <ellipse cx="0" cy="-11" rx="3" ry="8" transform="rotate(216)"/>
                            <ellipse cx="0" cy="-11" rx="3" ry="8" transform="rotate(252)"/>
                            <ellipse cx="0" cy="-11" rx="3" ry="8" transform="rotate(288)"/>
                            <ellipse cx="0" cy="-11" rx="3" ry="8" transform="rotate(324)"/>
                        </g>
                        <g fill="url(#carnationGrad2)" opacity="0.95">
                            <ellipse cx="0" cy="-7" rx="2.6" ry="6" transform="rotate(0)"/>
                            <ellipse cx="0" cy="-7" rx="2.6" ry="6" transform="rotate(60)"/>
                            <ellipse cx="0" cy="-7" rx="2.6" ry="6" transform="rotate(120)"/>
                            <ellipse cx="0" cy="-7" rx="2.6" ry="6" transform="rotate(180)"/>
                            <ellipse cx="0" cy="-7" rx="2.6" ry="6" transform="rotate(240)"/>
                            <ellipse cx="0" cy="-7" rx="2.6" ry="6" transform="rotate(300)"/>
                        </g>
                        <circle cx="0" cy="0" r="3" fill="#d6336c" opacity="0.9"/>
                    </g>

                    <g id="lily">
                        <g fill="url(#lilyGrad)" stroke="#e7588f" stroke-width="0.4">
                            <path d="M0,-2 C-5,-11 -4,-24 0,-27 C4,-24 5,-11 0,-2 Z" transform="rotate(0)"/>
                            <path d="M0,-2 C-5,-11 -4,-24 0,-27 C4,-24 5,-11 0,-2 Z" transform="rotate(60)"/>
                            <path d="M0,-2 C-5,-11 -4,-24 0,-27 C4,-24 5,-11 0,-2 Z" transform="rotate(120)"/>
                            <path d="M0,-2 C-5,-11 -4,-24 0,-27 C4,-24 5,-11 0,-2 Z" transform="rotate(180)"/>
                            <path d="M0,-2 C-5,-11 -4,-24 0,-27 C4,-24 5,-11 0,-2 Z" transform="rotate(240)"/>
                            <path d="M0,-2 C-5,-11 -4,-24 0,-27 C4,-24 5,-11 0,-2 Z" transform="rotate(300)"/>
                        </g>
                        <circle cx="-2" cy="-6" r="0.8" fill="#b0335f"/>
                        <circle cx="2" cy="-8" r="0.7" fill="#b0335f"/>
                        <circle cx="0" cy="-10" r="0.6" fill="#b0335f"/>
                        <circle cx="-3" cy="-9" r="0.6" fill="#b0335f"/>
                        <circle cx="3" cy="-6" r="0.6" fill="#b0335f"/>
                        <g stroke="#c2185b" stroke-width="1" fill="none">
                            <line x1="0" y1="0" x2="-7" y2="-15"/>
                            <line x1="0" y1="0" x2="7" y2="-15"/>
                            <line x1="0" y1="0" x2="-2" y2="-17"/>
                            <line x1="0" y1="0" x2="2" y2="-17"/>
                        </g>
                        <g fill="#8b3a3a">
                            <ellipse cx="-7" cy="-15" rx="1.6" ry="2.4" transform="rotate(-20 -7 -15)"/>
                            <ellipse cx="7" cy="-15" rx="1.6" ry="2.4" transform="rotate(20 7 -15)"/>
                            <ellipse cx="-2" cy="-17" rx="1.4" ry="2"/>
                            <ellipse cx="2" cy="-17" rx="1.4" ry="2"/>
                        </g>
                        <circle cx="0" cy="0" r="2" fill="#f9c1d6"/>
                    </g>
                </defs>

                <!-- Wrapper -->
                <g class="wrapper">
                    <path d="M 85 390 L 40 460 L 40 520 L 310 520 L 310 460 L 265 390 Z" fill="url(#sagewrap)" opacity="0.95"/>
                    <path d="M 95 395 L 55 450 L 55 510 L 295 510 L 295 450 L 255 395 Z" fill="url(#wrapper)" stroke="#e8b8c4" stroke-width="1" opacity="0.95"/>
                    <path d="M 105 395 L 80 435 L 80 500 L 270 500 L 270 435 L 245 395 Z" fill="#ffffff" stroke="none" opacity="0.6"/>
                </g>

                <!-- Ribbon -->
                <g class="ribbon">
                    <ellipse cx="175" cy="520" rx="55" ry="15" fill="#d88aa0" opacity="0.9"/>
                    <path d="M 150 520 Q 115 535 90 530" stroke="#d88aa0" stroke-width="8" fill="none" opacity="0.85"/>
                    <path d="M 200 520 Q 235 535 260 530" stroke="#d88aa0" stroke-width="8" fill="none" opacity="0.85"/>
                </g>

                <!-- Stems -->
                <line x1="175" y1="390" x2="150" y2="220" stroke="url(#stem)" stroke-width="3"/>
                <line x1="175" y1="390" x2="200" y2="190" stroke="url(#stem)" stroke-width="3"/>
                <line x1="175" y1="390" x2="175" y2="160" stroke="url(#stem)" stroke-width="3.5"/>
                <line x1="175" y1="390" x2="130" y2="170" stroke="url(#stem)" stroke-width="3"/>
                <line x1="175" y1="390" x2="220" y2="150" stroke="url(#stem)" stroke-width="3"/>
                <line x1="175" y1="390" x2="110" y2="240" stroke="url(#stem)" stroke-width="2.5"/>
                <line x1="175" y1="390" x2="240" y2="240" stroke="url(#stem)" stroke-width="2.5"/>
                <line x1="175" y1="390" x2="185" y2="210" stroke="url(#stem)" stroke-width="2.5"/>
                <line x1="175" y1="390" x2="160" y2="180" stroke="url(#stem)" stroke-width="2.5"/>
                <line x1="175" y1="390" x2="210" y2="220" stroke="url(#stem)" stroke-width="2.5"/>
                <line x1="175" y1="390" x2="140" y2="200" stroke="url(#stem)" stroke-width="2"/>
                <line x1="175" y1="390" x2="205" y2="170" stroke="url(#stem)" stroke-width="2.5"/>

                <!-- Leaves -->
                <g class="wrapper" fill="url(#stem)" opacity="0.85">
                    <path d="M 175 340 Q 120 300 105 260 Q 150 295 180 330 Z"/>
                    <path d="M 175 340 Q 230 300 245 258 Q 200 290 173 328 Z"/>
                    <path d="M 175 360 Q 140 330 128 300 Q 160 335 177 355 Z"/>
                    <path d="M 175 350 Q 225 310 240 270 Q 195 310 178 345 Z"/>
                    <path d="M 175 365 Q 145 330 135 300 Q 165 340 177 360 Z"/>
                    <path d="M 175 355 Q 220 300 235 255 Q 195 310 175 350 Z"/>
                </g>

                <!-- Baby's breath filler -->
                <g class="wrapper" fill="#ffffff" opacity="0.9">
                    <circle cx="160" cy="190" r="2.2"/>
                    <circle cx="168" cy="182" r="1.8"/>
                    <circle cx="188" cy="185" r="2"/>
                    <circle cx="195" cy="175" r="1.8"/>
                    <circle cx="175" cy="200" r="2"/>
                    <circle cx="147" cy="165" r="1.8"/>
                    <circle cx="203" cy="155" r="1.8"/>
                    <circle cx="180" cy="175" r="2"/>
                    <circle cx="170" cy="160" r="1.6"/>
                    <circle cx="190" cy="165" r="1.9"/>
                    <circle cx="155" cy="180" r="1.7"/>
                    <circle cx="197" cy="185" r="1.8"/>
                    <circle cx="185" cy="175" r="2"/>
                    <circle cx="162" cy="155" r="1.6"/>
                    <circle cx="207" cy="175" r="1.7"/>
                    <circle cx="135" cy="195" r="1.8"/>
                    <circle cx="215" cy="160" r="1.6"/>
                </g>

                <!-- Rose 1: Pink Lily -->
                <g class="rose" data-rose-id="rose-1" onclick="selectRose(0)">
                    <use href="#lily" transform="translate(175,150) scale(1.3)"/>
                </g>

                <!-- Rose 2: Pink Carnation -->
                <g class="rose" data-rose-id="rose-2" onclick="selectRose(1)">
                    <use href="#carnation" transform="translate(140,180) scale(1.15)"/>
                </g>

                <!-- Rose 3: Pink Rose -->
                <g class="rose" data-rose-id="rose-3" onclick="selectRose(2)">
                    <use href="#pinkrose" transform="translate(210,170) scale(1)"/>
                </g>

                <!-- Rose 4: Pink Carnation -->
                <g class="rose" data-rose-id="rose-4" onclick="selectRose(3)">
                    <use href="#carnation" transform="translate(120,160) scale(1.1)"/>
                </g>

                <!-- Rose 5: Pink Lily -->
                <g class="rose" data-rose-id="rose-5" onclick="selectRose(4)">
                    <use href="#lily" transform="translate(230,150) scale(1.1)"/>
                </g>

                <!-- Rose 6: Pink Rose -->
                <g class="rose" data-rose-id="rose-6" onclick="selectRose(5)">
                    <use href="#pinkrose" transform="translate(100,210) scale(0.95)"/>
                </g>

                <!-- Rose 7: Pink Carnation -->
                <g class="rose" data-rose-id="rose-7" onclick="selectRose(6)">
                    <use href="#carnation" transform="translate(250,210) scale(1.1)"/>
                </g>

                <!-- Rose 8: Pink Rose -->
                <g class="rose" data-rose-id="rose-8" onclick="selectRose(7)">
                    <use href="#pinkrose" transform="translate(175,200) scale(0.95)"/>
                </g>

                <!-- Rose 9: Pink Lily -->
                <g class="rose" data-rose-id="rose-9" onclick="selectRose(8)">
                    <use href="#lily" transform="translate(155,175) scale(1.05)"/>
                </g>

                <!-- Rose 10: Pink Carnation -->
                <g class="rose" data-rose-id="rose-10" onclick="selectRose(9)">
                    <use href="#carnation" transform="translate(195,190) scale(1)"/>
                </g>

                <!-- Rose 11: Pink Rose -->
                <g class="rose" data-rose-id="rose-11" onclick="selectRose(10)">
                    <use href="#pinkrose" transform="translate(130,205) scale(0.9)"/>
                </g>

                <!-- Rose 12: Pink Lily -->
                <g class="rose" data-rose-id="rose-12" onclick="selectRose(11)">
                    <use href="#lily" transform="translate(220,190) scale(1.15)"/>
                </g>
            </svg>
            </div>
        </div>

        <div class="progress">
            <div class="progress-text" id="progress-text">0 / 12 flowers revealed 🌸</div>
            <div class="progress-dots" id="progress-dots"></div>
        </div>
    </div>

    <!-- Message Popup -->
    <div class="message-backdrop" id="message-backdrop" onclick="closeMessage()"></div>
    <div class="message-popup" id="message-popup">
        <div class="message-card">
            <button class="message-close-btn" onclick="closeMessage()">✕</button>
            <p class="message-flower-name" id="message-flower-name"></p>
            <h2 class="message-title" id="message-title"></h2>
            <p class="message-text" id="message-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
